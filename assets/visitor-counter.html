<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://busuanzi.ibruce.info; base-uri 'none'; form-action 'none'">
<title>Isolated visitor counter</title>
</head>
<body>
<script>
(() => {
  // This bridge performs exactly one count request per load; retry is user initiated.
  const callback = 'siteCounter_' + Math.random().toString(36).slice(2);
  let done = false;
  const finish = payload => {
    if (done) return;
    done = true;
    clearTimeout(timer);
    parent.postMessage(payload, 'https://anson-he.github.io');
  };
  const fail = () => finish({ type: 'site-counter-error-v1' });
  const timer = setTimeout(fail, 20000);
  window[callback] = data => {
    if (!data || !/^\d{1,20}$/.test(String(data.site_pv)) ||
        !/^\d{1,20}$/.test(String(data.site_uv))) { fail(); return; }
    finish({ type: 'site-counter-result-v1', pv: data.site_pv, uv: data.site_uv });
  };
  const script = document.createElement('script');
  script.src = 'https://busuanzi.ibruce.info/busuanzi?jsonpCallback=' + callback;
  script.referrerPolicy = 'origin';
  script.onerror = fail;
  script.onload = () => { if (!done) fail(); };
  document.head.appendChild(script);
})();
</script>
</body>
</html>

ntent:center}.status{font:9px/1.5 'JetBrains Mono',monospace;border-radius:4px;padding:3px 7px;background:var(--soft);color:var(--accent)}.status.bad{background:var(--surface);color:var(--orange)}.footnote{font-size:10px;color:var(--muted);line-height:1.9}footer{border-top:1px solid var(--line);padding-top:20px;margin-top:28px;font:9px/1.8 'JetBrains Mono',monospace;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.table-action{border:0;padding:0;background:transparent;font-size:11px;color:var(--accent);text-align:left;word-break:break-word}.data-time{font-size:9px;color:var(--muted);margin-top:3px}.error-list{padding:0 20px 20px;word-break:break-word;font-size:11px}.error-list div{padding:8px 0;border-bottom:1px solid var(--line)}

<div id="analytics-app">
<header><div class="brand">Yuhao He <span class="muted">/ Analytics</span><small>PERSONAL REPOSITORY ARCHIVE</small></div><div class="toolbar"><button id="theme-toggle" class="theme-button" aria-label="切换深浅色主题" title="切换主题">◐</button><span class="private">PUBLIC DATA</span><button id="refresh" class="solid">刷新数据 ↻</button></div></header>
<div class="layout"><aside><a class="back-home" href="/">← 返回个人主页</a><div class="owner-name">Yuhao He</div><p class="owner-han">何宇浩 <span class="tiny">(Anson)</span></p><div class="aside-head"><span class="eyebrow">YOUR WORKSPACE</span><span class="tiny muted" id="repo-count">—</span></div><strong>Anson-He</strong><input class="search" id="search" placeholder="搜索仓库…" aria-label="搜索仓库"><nav id="repo-list" aria-label="仓库列表"></nav><div class="aside-bottom"><a class="homepage-visitor-link" href="https://mapmyvisitors.com/web/1c9do" target="_blank" rel="noopener noreferrer" title="点击地图查看主页访客的国家、城市与地理分布" style="display:block"><img src="https://mapmyvisitors.com/map.png?d=JQ7xDV9MOIq0bVAxXor5ANJuvsUyD_WFlK9RVL8SlHI&amp;cl=ffffff" alt="主页访客地理分布地图，点击查看详细报告" width="210" style="display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff" loading="lazy"></a><br><br>每日自动归档<br>北京时间 09:00<br><br><a href="https://github.com/Anson-He/github-traffic-vault" target="_blank" rel="noopener">打开数据仓库 ↗</a><p style="margin-top:12px">来自 GitHub 官方 REST API。历史从首次采集时开始积累。</p></div></aside>
<main><div class="page-top"><div><div class="eyebrow" id="section-label">PUBLIC DATA / OVERVIEW</div><h1 id="page-title">仓库流量</h1><p class="muted tiny" id="subtitle">GitHub 仓库访问、克隆与下载的长期记录。</p></div><div class="toolbar"><select id="range" aria-label="日期范围"><option value="14">最近 14 天</option><option value="30">最近 30 天</option><option value="90">最近 90 天</option><option value="365">最近一年</option><option value="all">全部历史</option></select><button id="export">导出 CSV ↓</button></div></div><div id="notice" class="notice" role="status" aria-live="polite"></div><div id="content"></div><footer><span id="updated">尚未读取数据</span><span>统计日界：UTC · 北京时间次日 08:00</span></footer></main></div></div>
<script>
'use strict';
let data=null,selected='all',loadError='',busy=false,dataOrigin='none';
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=n=>n==null?'—':Number(n).toLocaleString('zh-CN');
const fmt=s=>s?new Date(s).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}):'尚无记录';
const chosen=()=>data?data.repositories.filter(r=>selected==='all'||String(r.id)===selected):[];
function initTheme(){
 try{const saved=localStorage.getItem('theme');document.documentElement.dataset.theme=saved==='light'||saved==='dark'?saved:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch{}
 $('#theme-toggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;try{localStorage.setItem('theme',next)}catch{}};
}
function validate(d){if(d?.schema_version!==1||!Array.isArray(d.repositories)||!d.repositories.every(r=>r.id!=null&&typeof r.name==='string'&&['views','clones','snapshots','assets'].every(k=>r[k]===undefined||Array.isArray(r[k]))))throw Error('文件格式不正确：需要 schema_version=1 的 dashboard.json');return d}
function dateRange(){let end=new Date().toISOString().slice(0,10),n=$('#range').value,all=chosen().flatMap(r=>[...(r.views||[]),...(r.clones||[])]).map(x=>x.date).sort();let start=n==='all'?(all[0]||end):new Date(new Date(end+'T00:00:00Z').getTime()-(Number(n)-1)*86400000).toISOString().slice(0,10);return {start,end}}
function records(r,key){const {start,end}=dateRange();return (r[key]||[]).filter(x=>x.date>=start&&x.date<=end)}
function sums(key,field){const rows=chosen().flatMap(r=>records(r,key));return rows.length?rows.reduce((a,r)=>a+(r[field]||0),0):null}
function nav(){const query=$('#search').value.toLowerCase();$('#repo-count').textContent=data?data.repositories.length+' 个仓库':'—';const repos=(data?.repositories||[]).filter(r=>r.name.toLowerCase().includes(query));$('#repo-list').innerHTML='<button class="repo-btn '+(selected==='all'?'active':'')+'" data-id="all">◫ &nbsp; 全部仓库<span>汇总与趋势</span></button>'+repos.map(r=>'<button class="repo-btn '+(selected===String(r.id)?'active':'')+'" data-id="'+esc(r.id)+'">'+esc(r.name.split('/').slice(1).join('/'))+'<span>'+(r.private?'私密':'公开')+' · '+(r.discovered_in_latest_run===false?'未在本次发现':'已纳入归档')+'</span></button>').join('');$('#repo-list').querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=b.dataset.id;render()})}
function metric(label,value,sub){return '<div class="metric"><div class="metric-label">'+label+'</div><div class="metric-value">'+num(value)+'</div><div class="metric-sub">'+sub+'</div></div>'}
function table(headers,rows){return rows.length?'<div class="table-wrap"><table><thead><tr>'+headers.map((x,i)=>'<th'+(i?' class="num"':'')+'>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>':'<div class="empty">尚无可用记录</div>'}
function panel(title,sub,body,extra=''){return '<section class="panel"><div class="panel-head"><div><h2>'+title+'</h2><p>'+esc(sub)+'</p></div>'+extra+'</div>'+body+'</section>'}
function chart(key){const repos=chosen(),{start,end}=dateRange(),days=new Map();repos.forEach(r=>records(r,key).forEach(x=>{let d=days.get(x.date)||{count:0,n:0};d.count+=x.count;d.n++;days.set(x.date,d)}));if(!days.size)return '<div class="empty">此时间范围暂无数据。缺失数据不会显示成 0。</div>';let entries=[...days].sort((a,b)=>a[0].localeCompare(b[0])),max=Math.max(1,...entries.map(x=>x[1].count)),left=42,right=850,top=18,bottom=190,startMs=Date.parse(start),span=Math.max(86400000,Date.parse(end)-startMs);const xx=d=>left+(Date.parse(d)-startMs)/span*(right-left),yy=n=>bottom-n/max*(bottom-top);let s='<svg class="chart" viewBox="0 0 880 230" role="img" aria-label="每日次数趋势，聚焦圆点查看数值">';for(let i=0;i<4;i++){let val=max*i/3,y=yy(val);s+='<line x1="42" x2="850" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-dasharray="3 4"/><text x="32" y="'+(y+4)+'" text-anchor="end" fill="var(--muted)" font-size="10">'+num(Math.round(val))+'</text>'}let prev=null;for(const [d,r] of entries){const x=xx(d),y=yy(r.count);if(prev&&Date.parse(d)-Date.parse(prev[0])===86400000&&r.n===repos.length&&prev[1].n===repos.length)s+='<line x1="'+xx(prev[0])+'" y1="'+yy(prev[1].count)+'" x2="'+x+'" y2="'+y+'" stroke="'+(key==='views'?'var(--accent)':'var(--orange)')+'" stroke-width="2.5"/>';s+='<circle tabindex="0" cx="'+x+'" cy="'+y+'" r="4" fill="'+(r.n===repos.length?(key==='views'?'var(--accent)':'var(--orange)'):'var(--strong)')+'"><title>'+esc(d+'：'+r.count+' 次；有记录的仓库 '+r.n+'/'+repos.length)+'</title></circle>';prev=[d,r]}s+='<text x="42" y="218" fill="var(--muted)" font-size="10">'+esc(start)+'</text><text x="850" y="218" fill="var(--muted)" font-size="10" text-anchor="end">'+esc(end)+'</text></svg>';return '<div class="chart-wrap">'+s+'</div><div class="legend"><span><i class="dot" style="background:'+(key==='views'?'var(--accent)':'var(--orange)')+'"></i>有完整仓库覆盖的日期</span><span><i class="dot" style="background:var(--strong)"></i>部分仓库有记录</span><span>缺失日期留空 · 当天数据尚未完整</span></div>'}
function summaryTable(){return table(['仓库','浏览','克隆','Star / Fork'],chosen().map(r=>{let v=records(r,'views'),c=records(r,'clones'),m=r.snapshots?.at(-1);return '<tr><td><button class="table-action" data-select="'+esc(r.id)+'">'+esc(r.name.split('/').slice(1).join('/'))+'</button><div class="data-time">'+(r.private?'私密':'公开')+' · '+(r.last_success_at?fmt(r.last_success_at):'尚无完整采集')+'</div></td><td class="num">'+num(v.length?v.reduce((s,x)=>s+x.count,0):null)+'</td><td class="num">'+num(c.length?c.reduce((s,x)=>s+x.count,0):null)+'</td><td class="num">'+num(m?.stars)+' / '+num(m?.forks)+'</td></tr>'}))}
function rolling(r,key,label){const status=r.status?.[key];return panel(label,'最近一次成功采集的滚动 14 天 Top 10 · '+fmt(status?.observed_at),table([key==='paths'?'页面路径':'访问来源','次数','窗口独立访客'],(r[key]||[]).map(x=>'<tr><td class="path">'+esc(x.path||x.referrer)+'</td><td class="num">'+num(x.count)+'</td><td class="num">'+num(x.uniques)+'</td></tr>')),status?.ok?'<span class="status">已更新</span>':'<span class="status bad">未更新</span>')}
function downloads(r){return panel('Release 附件下载','每个附件的累计下载次数 · '+fmt(r.status?.assets?.observed_at),table(['版本 / 附件','大小','累计下载'],(r.assets||[]).map(a=>'<tr><td class="path">'+esc(a.name)+'<div class="data-time">'+esc(a.release)+'</div></td><td class="num">'+num(Math.round(a.size/1024))+' KB</td><td class="num">'+num(a.download_count)+'</td></tr>')))}
function dailyTable(){const rows=[];chosen().forEach(r=>{const v=new Map(records(r,'views').map(x=>[x.date,x])),c=new Map(records(r,'clones').map(x=>[x.date,x]));[...new Set([...v.keys(),...c.keys()])].sort().reverse().forEach(day=>{let a=v.get(day),b=c.get(day);rows.push('<tr><td>'+esc(day)+'<div class="data-time">'+esc(r.name)+'</div></td><td class="num">'+num(a?.count)+'</td><td class="num">'+num(a?.uniques)+'</td><td class="num">'+num(b?.count)+'</td><td class="num">'+num(b?.uniques)+'</td></tr>')})});return table(['日期 / 仓库','浏览','当日独立访客','克隆','当日独立克隆数'],rows)}
function render(){ nav();let repos=chosen(),r=selected==='all'?null:repos[0];$('#page-title').textContent=r?r.name.split('/').slice(1).join('/'):'仓库流量';$('#section-label').textContent=r?'PUBLIC DATA / REPOSITORY':'PUBLIC DATA / OVERVIEW';$('#subtitle').textContent=r?(r.description||'这份仓库的长期访问档案。'):'GitHub 仓库访问、克隆与下载的长期记录。';$('#updated').textContent=data?'档案更新：'+fmt(data.generated_at)+'（北京时间） · '+({snapshot:'公开快照',network:'GitHub 归档'}[dataOrigin]||'档案'):'尚未读取数据';let warnings=[];if(loadError)warnings.push(loadError);if(data){if(!data.generated_at)warnings.push('尚未运行首次采集。');else if(Date.now()-Date.parse(data.generated_at)>48*3600000)warnings.push('档案超过 48 小时未更新，请检查 Actions。');if(data.errors?.length)warnings.push('上次采集有 '+data.errors.length+' 项异常；保留上次成功数据，详情见下方。')}$('#notice').textContent=warnings.join(' ');if(!data||!data.repositories.length){$('#content').innerHTML='<section class="panel empty big"><h2>暂无统计数据</h2><p>请稍后刷新查看公开归档。</p></section>';return}
let html='<div class="metrics">'+metric('浏览次数',sums('views','count'),'所选日期 · 已记录的访问次数')+metric('克隆次数',sums('clones','count'),'所选日期 · 完整克隆次数')+metric('独立访客 · 滚动 14 天',r?r.views_window?.uniques:null,r?'单仓库窗口去重 · '+fmt(r.views_window?.observed_at):'选择单个仓库查看，跨仓库不可去重')+metric('独立克隆 · 滚动 14 天',r?r.clones_window?.uniques:null,r?'单仓库窗口去重 · '+fmt(r.clones_window?.observed_at):'选择单个仓库查看，跨仓库不可去重')+'</div>';
html+=panel('访问趋势','可切换浏览 / 克隆；统计日期使用 UTC','<div id="trend">'+chart('views')+'</div>','<select id="chart-key" aria-label="趋势指标"><option value="views">浏览次数</option><option value="clones">克隆次数</option></select>');
html+=r?'<div class="two-col">'+rolling(r,'referrers','人们从哪里来')+rolling(r,'paths','哪些页面被查看')+'</div>'+downloads(r)+panel('仓库快照','每日归档时的累计量；不是当日新增量',table(['日期（UTC）','Stars','Forks','附件下载总量'],[...(r.snapshots||[])].reverse().filter(x=>x.date>=dateRange().start&&x.date<=dateRange().end).map(x=>'<tr><td>'+esc(x.date)+'</td><td class="num">'+num(x.stars)+'</td><td class="num">'+num(x.forks)+'</td><td class="num">'+num(x.downloads)+'</td></tr>'))):panel('仓库概览','点击仓库查看访问来源、热门页面与附件下载',summaryTable());
html+=panel('每日明细','“—”表示没有采集记录；独立访客与独立克隆仅在单日内去重',dailyTable());
if(data.errors?.length)html+=panel('采集异常','异常不会被记成零；当前不可访问的仓库仍保留历史','<div class="error-list">'+data.errors.map(e=>'<div><strong>'+esc(e.repository)+'</strong> / '+esc(e.source)+'<br>'+esc(e.error)+'</div>').join('')+'</div>');
html+='<p class="footnote">访问、克隆可能来自自动化程序。每日独立人数不能相加当作月度独立人数；滚动 14 天快照也不能相加。<br>来源与热门页面只包含 GitHub 返回的 Top 10。Release 计数仅覆盖上传附件，删除附件可能使累计总量下降；源码 ZIP 下载没有单独计数。</p>';$('#content').innerHTML=html;$('#chart-key').onchange=e=>$('#trend').innerHTML=chart(e.target.value);document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{selected=b.dataset.select;render();window.scrollTo({top:0,behavior:'smooth'})})}
async function load(){
 if(busy)return;
 busy=true;$('#refresh').disabled=true;$('#refresh').textContent='读取中…';loadError='';
 try{
  const response=await fetch('https://api.github.com/repos/Anson-He/github-traffic-vault/contents/data/dashboard.json',{
   headers:{Accept:'application/vnd.github.raw+json'},credentials:'omit',cache:'no-store',redirect:'error',referrerPolicy:'no-referrer',signal:AbortSignal.timeout(10000)});
  if(!response.ok)throw Error('公开归档暂时不可用');
  if(Number(response.headers.get('Content-Length')||0)>20*1024*1024)throw Error('档案过大');
  data=validate(await response.json());dataOrigin='network';
 }catch(e){
  if(!data){
   try{
    const response=await fetch('./data/dashboard.json',{credentials:'omit',cache:'no-cache',signal:AbortSignal.timeout(10000)});
    if(!response.ok)throw Error('快照无法读取');
    data=validate(await response.json());dataOrigin='snapshot';
   }catch{loadError='暂时无法读取公开统计，请稍后刷新。'}
  }
 }finally{busy=false;$('#refresh').disabled=false;$('#refresh').textContent='刷新数据 ↻';render()}
}
$('#refresh').onclick=load;$('#search').oninput=nav;$('#range').onchange=render;
$('#export').onclick=()=>{if(!data){loadError='请先连接仓库或导入档案。';render();return}const field=v=>'"'+String(v??'').replace(/^[=+@\-]/,"'$&").replace(/"/g,'""')+'"',rows=[['repository','date_utc','views','daily_unique_visitors','clones','daily_unique_cloners']];chosen().forEach(r=>{let v=new Map(records(r,'views').map(x=>[x.date,x])),c=new Map(records(r,'clones').map(x=>[x.date,x]));[...new Set([...v.keys(),...c.keys()])].sort().forEach(d=>rows.push([r.name,d,v.get(d)?.count,v.get(d)?.uniques,c.get(d)?.count,c.get(d)?.uniques]))});let url=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(field).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='github-traffic.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
initTheme();render();load();
</script></body></html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.url == "/" %}Yuhao He | 何宇浩{% elsif page.title %}{{ page.title | strip_html | escape }} · Yuhao He{% else %}Yuhao He{% endif %}</title>
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | escape }}">
    <meta name="author" content="Yuhao He">
    <meta name="keywords" content="Yuhao He, He Yuhao, 何宇浩, Macau University of Science and Technology, secure AI, trustworthy AI, adversarial machine learning, AI-generated content security">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{% if page.url == "/" %}Yuhao He | 何宇浩{% else %}{{ page.title | default: site.title | strip_html | escape }}{% endif %}">
    <meta property="og:description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/images/google-scholar-avatar.jpg' | absolute_url }}">
    <link rel="icon" type="image/png" sizes="64x64" href="{{ '/images/favicon-yuhao.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/jemdoc.css' | relative_url }}?v=20260914-2">
    {% if page.url == "/" %}
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Yuhao He",
        "alternateName": "何宇浩",
        "url": "{{ site.url }}",
        "image": "{{ '/images/google-scholar-avatar.jpg' | absolute_url }}",
        "jobTitle": "Ph.D. Student in Artificial Intelligence",
        "affiliation": {
          "@type": "CollegeOrUniversity",
          "name": "Macau University of Science and Technology"
        },
        "sameAs": [
          "https://scholar.google.com/citations?user=Ug6Zp5IAAAAJ",
          "https://dblp.org/pid/257/8328-1.html",
          "https://orcid.org/0009-0002-8778-5025",
          "https://github.com/Anson-He"
        ]
      }
    </script>
    {% endif %}
  </head>

        <a href="{{ '/' | relative_url }}">Yuhao He</a>
        <span aria-hidden="true">·</span>

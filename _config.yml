locale: "en-US"
title: "Yuhao He"
name: "Yuhao He"
description: "Academic homepage of Yuhao He, a Ph.D. student researching secure and trustworthy AI at Macau University of Science and Technology."
url: "https://anson-he.github.io"
baseurl: ""
repository: "Anson-He/Anson-He.github.io"
timezone: "Asia/Macau"

future: true
encoding: "utf-8"
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  entity_output: as_char

include:
  - _pages

exclude:
  - .bundle
  - .github
  - .gitignore
  - AUTOMATION.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - scripts
  - tests
  - vendor

collections:
  publications:
    output: true
    permalink: /publication/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
  - scope:
      path: ""
      type: publications
    values:
      layout: single

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

whitelist:
  - jekyll-sitemap
  - jekyll-redirect-from

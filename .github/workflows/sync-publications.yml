name: Sync papers from Semantic Scholar

on:
  workflow_dispatch:
  schedule:
    # Mondays at 06:15 UTC, following Drew Dimmery's cadence.
    - cron: "15 6 * * 1"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: sync-semantic-scholar-papers
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Test paper synchronizer
        run: python -m unittest discover -s tests

      - name: Archive stale review candidates
        run: python scripts/sync_semantic_scholar.py --prune-only

      - name: Commit archived candidates
        run: |
          git add _publications _data/semantic_scholar_ignored.json
          if git diff --cached --quiet; then
            echo "No stale candidates to archive."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: archive stale publication candidates"
          git push

      - name: Discover new papers
        env:
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: python scripts/sync_semantic_scholar.py

      - name: Check for publication changes
        id: changes
        run: |
          git add _publications
          if git diff --cached --quiet; then
            echo "No publication changes found."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open a hidden-by-default publication review
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          open_reviews=$(gh pr list --state open --limit 100 --json headRefName --jq '[.[] | select(.headRefName | startswith("automation/publication-review-"))] | length')
          if [ "$open_reviews" -gt 0 ]; then
            echo "A publication review PR is already open; leaving it untouched for manual review."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          review_branch="automation/publication-review-${GITHUB_RUN_ID}"
          git switch -c "$review_branch"
          git commit -m "chore: stage publication updates for review"
          git push origin "$review_branch"

          gh pr create \
            --base main \
            --head "$review_branch" \
            --title "Review newly discovered publication metadata" \
            --assignee "Anson-He" \
            --draft \
            --body "$(cat <<'EOF'
          @Anson-He, the weekly Semantic Scholar check found papers that need your review.

          New records are deliberately marked `visible: false`, so they cannot appear on the public homepage before approval.

          To approve a publication:

          1. Check its title, authors, venue, year, and links in the **Files changed** tab.
          2. Replace the placeholder with the official abstract and add publisher/arXiv BibTeX if the paper should be published.
          3. Change `visible: false` to `visible: true`, mark this pull request ready, and merge it.

          If the record is incorrect or belongs to another researcher with the same name, leave `visible: false` unchanged and merge the pull request. This records the decision and prevents the same paper from triggering another reminder. Closing without merging will cause Semantic Scholar to rediscover it on a later run.

          GitHub assigned this pull request to you so that your GitHub notification email receives the review reminder.
          EOF
          )"

name: Sync publications from DBLP

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

concurrency:
  group: sync-publications
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Test publication synchronizer
        run: python -m unittest discover -s tests

      - name: Synchronize publications and news
        run: python scripts/sync_publications.py

      - name: Commit updated publication metadata
        run: |
          git add _publications _data/auto_news.yml _data/publication_sync.json
          if git diff --cached --quiet; then
            echo "No publication changes found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync publications from DBLP"
          git push
